      <stop offset="1" stop-color="#062f23"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1cf76"/>
      <stop offset="0.52" stop-color="#d49a2f"/>
